name = "arkdoctor"
main = "worker.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Per-IP rate limit for the public booking form (/agendar). 5 booking
# submissions per minute per IP; reads are not counted.
[[ratelimits]]
name = "BOOKING_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Per-IP rate limit for the public consent-signing route (/assinar). 5
# submissions per minute per IP.
[[ratelimits]]
name = "CONSENT_SIGN_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[vars]
APP_URL = "https://arkdoctor.edersonfantin98.workers.dev"

# Cron diário 04:20 UTC (~01:20 BRT) — apaga do bucket whatsapp-media a mídia
# com sent_at > 30 dias e marca a mensagem como 'expired'. Ver
# src/app/api/whatsapp/media-retention/route.ts.
[triggers]
crons = ["20 4 * * *"]
