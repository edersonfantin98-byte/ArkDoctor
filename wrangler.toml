name = "arkdoctor"
main = ".open-next/worker.js"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Per-IP rate limit for the public booking form (/agendar). 5 booking
# submissions per minute per IP; reads are not counted.
[[ratelimit]]
name = "BOOKING_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
